name: model-card-refresh

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Generate model card
        run: python tools/generate_model_card.py
      - name: Commit updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(model-card): refresh repository manifest"
          file_pattern: |
            docs/model_card.md
            model_cards/model_card.json
