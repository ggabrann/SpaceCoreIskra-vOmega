# CI Workflow for SpaceCore Iskra v3.6
# Версия: 3.6.0
# Дата: 2025-10-13
name: CI / Tests and Security Check
on:
  push:
    branches: [ "main", "canon/v3.6" ]
  pull_request:
    branches: [ "main" ]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run Smoke Tests
      run: python tests/run_evals.py --smoke
  redteam:
    needs: tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Run Red Team Security Tests
      run: python tests/run_redteam.py
